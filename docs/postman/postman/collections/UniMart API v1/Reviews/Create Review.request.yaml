$kind: http-request
url: "{{base_url}}/reviews"
method: POST
body:
  type: json
  content: |-
    {
      "orderId": 1,
      "rating": 5,
      "comment": "Excellent service, book was delivered fast and looks exactly like the photos."
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 2000
